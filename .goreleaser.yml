project_name: 'geoipupdate'
version: 2
# Keep these here rather than in builds[].hooks.post. Build hooks run once per
# build target, concurrently, so several copies of one 'make data' would race to
# write the same files in a single BUILDDIR. Global before hooks run once, in
# the order given.
before:
  hooks:
    - 'make data BUILDDIR="build/unix"'
    - 'make data BUILDDIR="build/packages" CONFFILE=/etc/GeoIP.conf DATADIR=/usr/share/GeoIP'
    - 'make data OS=Windows_NT BUILDDIR="build/windows"'
archives:
  - id: 'archives-unix'
    ids:
      - 'geoipupdate-unix'
    wrap_in_directory: true
    files:
      - 'CHANGELOG.md'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'
      - 'README.md'
      - src: 'build/unix/*'
        dst: '.'
        strip_parent: true
  - id: 'archives-windows'
    ids:
      - 'geoipupdate-windows'
    wrap_in_directory: true
    files:
      - 'CHANGELOG.md'
      - 'LICENSE-APACHE'
      - 'LICENSE-MIT'
      - 'README.md'
      - src: 'build/windows/*'
        dst: '.'
        strip_parent: true
    formats: ['zip']
builds:
  - id: 'geoipupdate-unix'
    main: './cmd/geoipupdate'
    binary: 'geoipupdate'
    goarch:
      - '386'
      - 'amd64'
      - 'arm'
      - 'arm64'
    goos:
      - 'darwin'
      - 'linux'
      - 'freebsd'
      - 'openbsd'
    flags:
      - '-trimpath'
    # All three builds set ldflags explicitly rather than taking GoReleaser's
    # default, which also injects main.commit, main.date and main.builtBy. None
    # of those exist in the source, and its main.date is the time of the build,
    # so the default would put a build timestamp back into binaries that
    # mod_timestamp is keeping reproducible. cmd/geoipupdate/version.go recovers
    # the commit and its time from debug.ReadBuildInfo() instead.
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    mod_timestamp: '{{ .CommitTimestamp }}'
    env:
      - CGO_ENABLED=0
  # This is a separate build as we want to specify different paths in the
  # ldflags. It must only feed nfpms. Its binary has the same name as the one
  # from geoipupdate-unix, so any archives or dockers entry that does not pin
  # ids matches it too and may ship a binary that defaults to /etc/GeoIP.conf
  # and /usr/share/GeoIP.
  - id: 'geoipupdate-packages'
    main: './cmd/geoipupdate'
    binary: 'geoipupdate'
    goarch:
      - '386'
      - 'amd64'
      - 'arm'
      - 'arm64'
    goos:
      - 'linux'
    flags:
      - '-trimpath'
    ldflags:
      - '-s -w -X main.version={{.Version}} -X main.defaultConfigFile=/etc/GeoIP.conf -X main.defaultDatabaseDirectory=/usr/share/GeoIP'
    mod_timestamp: '{{ .CommitTimestamp }}'
    env:
      - CGO_ENABLED=0
  - id: 'geoipupdate-windows'
    main: './cmd/geoipupdate'
    binary: 'geoipupdate'
    goarch:
      - '386'
      - 'amd64'
      - 'arm64'
    goos:
      - 'windows'
    flags:
      - '-trimpath'
    ldflags:
      - '-s -w -X main.version={{.Version}}'
    mod_timestamp: '{{ .CommitTimestamp }}'
    env:
      - CGO_ENABLED=0
# Do not migrate this to dockers_v2 yet. As of GoReleaser 2.15.3, dockers_v2
# invokes Docker Buildx with flags that Podman's Docker-compatible CLI does not
# support, and releases are currently run in a Podman-backed environment.
dockers:
  - ids:
      - 'geoipupdate-unix'
    image_templates:
      - "maxmindinc/geoipupdate:{{ .Tag }}-amd64"
      - "ghcr.io/maxmind/geoipupdate:{{ .Tag }}-amd64"
    dockerfile: docker/Dockerfile
    use: buildx
    goarch: amd64
    extra_files:
      - docker/entry.sh
      - docker/healthcheck.sh
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .CommitDate }}"
      - "--label=org.opencontainers.image.source=https://github.com/maxmind/geoipupdate"
      - "--label=org.opencontainers.image.url=https://github.com/maxmind/geoipupdate"
      - "--label=org.opencontainers.image.documentation=https://github.com/maxmind/geoipupdate/blob/main/README.md"
      - "--label=org.opencontainers.image.licenses=Apache-2.0 OR MIT"
      - "--label=org.opencontainers.image.vendor=MaxMind, Inc."
  - ids:
      - 'geoipupdate-unix'
    image_templates:
      - "maxmindinc/geoipupdate:{{ .Tag }}-arm64"
      - "ghcr.io/maxmind/geoipupdate:{{ .Tag }}-arm64"
    dockerfile: docker/Dockerfile
    use: buildx
    goarch: arm64
    extra_files:
      - docker/entry.sh
      - docker/healthcheck.sh
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .CommitDate }}"
      - "--label=org.opencontainers.image.source=https://github.com/maxmind/geoipupdate"
      - "--label=org.opencontainers.image.url=https://github.com/maxmind/geoipupdate"
      - "--label=org.opencontainers.image.documentation=https://github.com/maxmind/geoipupdate/blob/main/README.md"
      - "--label=org.opencontainers.image.licenses=Apache-2.0 OR MIT"
      - "--label=org.opencontainers.image.vendor=MaxMind, Inc."
  - ids:
      - 'geoipupdate-unix'
    image_templates:
      - "maxmindinc/geoipupdate:{{ .Tag }}-arm-v6"
      - "ghcr.io/maxmind/geoipupdate:{{ .Tag }}-arm-v6"
    dockerfile: docker/Dockerfile
    use: buildx
    goarch: arm
    goarm: 6
    extra_files:
      - docker/entry.sh
      - docker/healthcheck.sh
    build_flag_templates:
      - "--platform=linux/arm/v6"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.created={{ .CommitDate }}"
      - "--label=org.opencontainers.image.source=https://github.com/maxmind/geoipupdate"
      - "--label=org.opencontainers.image.url=https://github.com/maxmind/geoipupdate"
      - "--label=org.opencontainers.image.documentation=https://github.com/maxmind/geoipupdate/blob/main/README.md"
      - "--label=org.opencontainers.image.licenses=Apache-2.0 OR MIT"
      - "--label=org.opencontainers.image.vendor=MaxMind, Inc."
docker_manifests:
  - name_template: "maxmindinc/geoipupdate:{{ .Tag }}"
    image_templates:
      - "maxmindinc/geoipupdate:{{ .Tag }}-amd64"
      - "maxmindinc/geoipupdate:{{ .Tag }}-arm64"
      - "maxmindinc/geoipupdate:{{ .Tag }}-arm-v6"
  - name_template: "maxmindinc/geoipupdate:v{{ .Major }}"
    skip_push: 'auto'
    image_templates:
      - "maxmindinc/geoipupdate:{{ .Tag }}-amd64"
      - "maxmindinc/geoipupdate:{{ .Tag }}-arm64"
      - "maxmindinc/geoipupdate:{{ .Tag }}-arm-v6"
  - name_template: "maxmindinc/geoipupdate:v{{ .Major }}.{{ .Minor }}"
    skip_push: 'auto'
    image_templates:
      - "maxmindinc/geoipupdate:{{ .Tag }}-amd64"
      - "maxmindinc/geoipupdate:{{ .Tag }}-arm64"
      - "maxmindinc/geoipupdate:{{ .Tag }}-arm-v6"
  - name_template: "maxmindinc/geoipupdate:latest"
    skip_push: 'auto'
    image_templates:
      - "maxmindinc/geoipupdate:{{ .Tag }}-amd64"
      - "maxmindinc/geoipupdate:{{ .Tag }}-arm64"
      - "maxmindinc/geoipupdate:{{ .Tag }}-arm-v6"
  - name_template: "ghcr.io/maxmind/geoipupdate:{{ .Tag }}"
    image_templates:
      - "ghcr.io/maxmind/geoipupdate:{{ .Tag }}-amd64"
      - "ghcr.io/maxmind/geoipupdate:{{ .Tag }}-arm64"
      - "ghcr.io/maxmind/geoipupdate:{{ .Tag }}-arm-v6"
  - name_template: "ghcr.io/maxmind/geoipupdate:v{{ .Major }}"
    skip_push: 'auto'
    image_templates:
      - "ghcr.io/maxmind/geoipupdate:{{ .Tag }}-amd64"
      - "ghcr.io/maxmind/geoipupdate:{{ .Tag }}-arm64"
      - "ghcr.io/maxmind/geoipupdate:{{ .Tag }}-arm-v6"
  - name_template: "ghcr.io/maxmind/geoipupdate:v{{ .Major }}.{{ .Minor }}"
    skip_push: 'auto'
    image_templates:
      - "ghcr.io/maxmind/geoipupdate:{{ .Tag }}-amd64"
      - "ghcr.io/maxmind/geoipupdate:{{ .Tag }}-arm64"
      - "ghcr.io/maxmind/geoipupdate:{{ .Tag }}-arm-v6"
  - name_template: "ghcr.io/maxmind/geoipupdate:latest"
    skip_push: 'auto'
    image_templates:
      - "ghcr.io/maxmind/geoipupdate:{{ .Tag }}-amd64"
      - "ghcr.io/maxmind/geoipupdate:{{ .Tag }}-arm64"
      - "ghcr.io/maxmind/geoipupdate:{{ .Tag }}-arm-v6"
nfpms:
  - ids:
      - 'geoipupdate-packages'
    vendor: 'MaxMind, Inc.'
    homepage: https://github.com/maxmind/geoipupdate
    maintainer: 'MaxMind, Inc. <support@maxmind.com>'
    description: Program to perform automatic updates of GeoIP and GeoLite binary databases.
    license: 'Apache-2.0 OR MIT'
    section: 'net'
    mtime: '{{ .CommitDate }}'
    rpm:
      summary: 'Automatic updater for GeoIP and GeoLite binary databases'
      buildhost: 'maxmind.com'
    formats:
      - deb
      - rpm
    dependencies:
      - 'ca-certificates'
    bindir: /usr/bin
    contents:
      - dst: /usr/share/GeoIP
        type: 'dir'
      - src: 'CHANGELOG.md'
        dst: '/usr/share/doc/geoipupdate/CHANGELOG.md'
      - src: 'LICENSE-APACHE'
        dst: '/usr/share/doc/geoipupdate/LICENSE-APACHE'
      - src: 'LICENSE-MIT'
        dst: '/usr/share/doc/geoipupdate/LICENSE-MIT'
      - src: 'README.md'
        dst: '/usr/share/doc/geoipupdate/README.md'
      # Debian Policy 12.5 requires a verbatim copyright file at this exact
      # path. It is a Debian format, so it goes in the deb only.
      - src: 'packaging/copyright'
        dst: '/usr/share/doc/geoipupdate/copyright'
        packager: 'deb'
      - src: 'build/packages/GeoIP.conf'
        dst: '/usr/share/doc/geoipupdate/GeoIP.conf'
      - src: 'build/packages/GeoIP.conf.md'
        dst: '/usr/share/doc/geoipupdate/GeoIP.conf.md'
      - src: 'build/packages/geoipupdate.md'
        dst: '/usr/share/doc/geoipupdate/geoipupdate.md'
      - src: 'build/packages/GeoIP.conf.5'
        dst: '/usr/share/man/man5/GeoIP.conf.5'
      - src: 'build/packages/geoipupdate.1'
        dst: '/usr/share/man/man1/geoipupdate.1'
      - src: 'build/packages/GeoIP.conf'
        dst: '/etc/GeoIP.conf'
        type: 'config|noreplace'
release:
  name_template: "{{.Version}}"
  target_commitish: "{{ .FullCommit }}"
  prerelease: auto
  make_latest: '{{ if .Prerelease }}false{{ else }}true{{ end }}'
